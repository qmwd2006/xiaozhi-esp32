name: Build xz_core (native tests + wasm)

# 本机没有 emscripten 也照样能出 core.wasm：在 CI 里装 emscripten（apt），
# 原生测试、工具表快照、wasm 产物一次性产出。
on:
  workflow_dispatch:
  push:
    paths:
      - 'xz_core/**'
      - '.github/workflows/build-xz-core.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ emscripten
          emcc --version | head -2
          cmake --version | head -1

      - name: Native build + tests
        run: |
          cmake -S xz_core -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j"$(nproc)"
          ctest --test-dir build-native --output-on-failure

      - name: Dump tools.json (与固件同源的契约快照)
        run: |
          ./build-native/xz_dump_tools > tools.json
          python3 - <<'PY'
          import json
          d = json.load(open('tools.json'))
          print('tools:', len(d))
          assert len(d) == 23, d
          names = {t['name'] for t in d}
          for need in ('self.music.set_queue', 'self.music.seek', 'self.audio_speaker.set_volume'):
              assert need in names, need
          PY

      - name: Build wasm
        run: |
          emcmake cmake -S xz_core -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j"$(nproc)"
          ls -lh build-wasm/xz_core.js build-wasm/xz_core.wasm

      - name: Smoke test wasm under node
        run: |
          node - <<'JS'
          const fs = require('fs');
          const factory = require('./build-wasm/xz_core.js');
          (async () => {
            const path = require('path');
            // 直接把 wasm 字节喂给模块，绕开 node 下 fetch 相对 URL 的问题
            const wasmBinary = fs.readFileSync(path.join(process.cwd(), 'build-wasm', 'xz_core.wasm'));
            const m = typeof factory === 'function'
              ? await factory({ wasmBinary, locateFile: f => path.join(process.cwd(), 'build-wasm', f) })
              : factory;
            const tools = JSON.parse(m.UTF8ToString(m._xz_tools_json()));
            console.log('wasm tools:', tools.length);
            if (tools.length !== 23) throw new Error('tools count ' + tools.length);
            const res = JSON.parse(m.ccall('xz_mcp_handle', 'string', ['string'], [JSON.stringify({
              jsonrpc: '2.0', id: 1, method: 'tools/call',
              params: { name: 'self.music.set_queue', arguments: { urls: 'a\nb', titles: 'A\nB' } },
            })]));
            const text = res.result.content[0].text;
            if (!text.includes('"queue_length":2')) throw new Error('unexpected: ' + text);
            console.log('set_queue ok:', text.slice(0, 60));
          })().catch(e => { console.error(e); process.exit(1); });
          JS

      - name: Replay device scenarios (same fixture as native test)
        run: |
          node - <<'JS'
          const fs = require('fs'), path = require('path');
          const factory = require('./build-wasm/xz_core.js');
          (async () => {
            const wasmBinary = fs.readFileSync(path.join(process.cwd(), 'build-wasm', 'xz_core.wasm'));
            const m = await factory({ wasmBinary, locateFile: f => path.join(process.cwd(), 'build-wasm', f) });
            const ev = (e, row) => JSON.stringify({
              event: e,
              aec: 1,
              busy: +row.busy, paused: +row.paused, user_paused: +row.user_paused,
              user_stopped: +row.user_stopped, pos: +row.pos,
              url: row.url === '-' ? '' : row.url, queue_len: +row.queue_len, index: +row.index,
            });
            const lines = fs.readFileSync('xz_core/scenarios/device_scenarios.tsv', 'utf8')
              .split('\n').filter(l => l.trim() && !l.startsWith('#') && !l.startsWith('scenario'));
            let cur = null, total = 0, failed = 0;
            const head = ['scenario','event','busy','paused','user_paused','user_stopped','pos','url','queue_len','index','exp_state','exp_uplink','exp_music','exp_pos'];
            for (const line of lines) {
              const c = line.split('\t');
              const row = Object.fromEntries(head.map((k, i) => [k, c[i]]));
              if (row.scenario !== cur) { cur = row.scenario; m.ccall('xz_device_reset', 'null', []); }
              const got = JSON.parse(m.ccall('xz_device_event', 'string', ['string'], [ev(row.event, row)]));
              const music = got.music.action || 'none';
              total++;
              const ok = got.state === row.exp_state && (got.uplink ? 1 : 0) === +row.exp_uplink &&
                         music === row.exp_music && (got.music.pos | 0) === +row.exp_pos;
              if (!ok) { failed++; console.log('FAIL', row.scenario + '/' + row.event, JSON.stringify(got)); }
            }
            console.log(`scenarios: ${total} steps, ${failed} failed`);
            if (failed) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: xz-core-wasm
          path: |
            build-wasm/xz_core.js
            build-wasm/xz_core.wasm
            tools.json
            xz_core/scenarios/device_scenarios.tsv